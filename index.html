<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aytomori полезные ссылки</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #e2ecf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }
        .links-container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 40px -15px rgba(0, 35, 50, 0.25),
                        0 10px 20px -8px rgba(0, 0, 0, 0.1),
                        inset 0 1px 3px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-weight: 650;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            color: #1a3349;
            margin-bottom: 0.25rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.7);
        }

        .subhead {
            text-align: center;
            color: #2a4d6e;
            margin-bottom: 2rem;
            font-weight: 400;
            font-size: 1.15rem;
            border-bottom: 2px dashed #b8cfe3;
            padding-bottom: 1rem;
        }
        .categories-grid {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .category {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            padding: 1.2rem 1rem 1.5rem 1rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 14px rgba(0, 20, 30, 0.05);
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.7);
        }

        .category:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(130, 180, 220, 0.3);
        }

        .category-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1e3b4f;
            padding-left: 0.5rem;
            margin-bottom: 1.2rem;
            border-bottom: 3px solid rgba(80, 130, 180, 0.2);
            padding-bottom: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.3rem;
        }
        .category-links {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
            box-shadow: 0 6px 12px -6px rgba(30, 50, 70, 0.15),
                        0 3px 6px rgba(0, 0, 0, 0.02),
                        inset 0 -1px 0 rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-decoration: none;
            color: #1e3c5a;
            font-weight: 550;
            font-size: 1.1rem;
            gap: 12px;
            width: 100%;
            white-space: nowrap;
        }

        .link-card i {
            font-size: 1.7rem;
            width: 2rem;
            text-align: center;
            transition: transform 0.15s ease;
            color: #2c577c;
            flex-shrink: 0;
        }

        .link-card .fa-telegram { color: #2A8BD2; }
        .link-card .fa-envelope { color: #D94A3D; }
        .link-card .fa-behance { color: #1769FF; }
        .link-card .fa-bolt { color: #000000; } 
        .link-card .fa-building { color: #d1442c; } 
        .link-card .fa-github { color: #24292e; }

        .link-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 20px -10px rgba(25, 75, 105, 0.25),
                        0 6px 10px -4px rgba(0,0,0,0.1);
            background: white;
            border-color: rgba(90, 150, 210, 0.3);
        }

        .link-card:hover i {
            transform: scale(1.08);
        }

        .link-card:active {
            transform: scale(0.98);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }

        footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #3f5e7a;
            opacity: 0.7;
            border-top: 1px dashed #b6cfdf;
            padding-top: 1.5rem;
        }
        @media (max-width: 450px) {
            .links-container {
                padding: 1.8rem 1.2rem;
            }
            .category-title {
                font-size: 1.5rem;
            }
            .link-card {
                padding: 0.7rem 1rem;
                font-size: 1rem;
                white-space: normal;
            }
        }
    </style>
</head>
