<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки по категориям</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #e2ecf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .links-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 40px -15px rgba(0, 35, 50, 0.25),
                        0 10px 20px -8px rgba(0, 0, 0, 0.1),
                        inset 0 1px 3px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-weight: 650;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            color: #1a3349;
            margin-bottom: 0.25rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.7);
        }

        .subhead {
            text-align: center;
            color: #2a4d6e;
            margin-bottom: 2.8rem;
            font-weight: 400;
            font-size: 1.15rem;
            border-bottom: 2px dashed #b8cfE3;
            padding-bottom: 1rem;
        }

        /* сетка категорий */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem 1.8rem;
            margin-bottom: 2rem;
        }

        /* карточка категории */
        .category {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            padding: 1.2rem 1rem 1.5rem 1rem;
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 14px rgba(0, 20, 30, 0.05);
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.7);
        }

        .category:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(130, 180, 220, 0.3);
        }

        .category-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1e3b4f;
            padding-left: 0.5rem;
            margin-bottom: 1.2rem;
            border-bottom: 3px solid rgba(80, 130, 180, 0.2);
            padding-bottom: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.3rem;
        }

        .category-title span {
            font-size: 1rem;
            font-weight: 400;
            color: #3f627c;
            background: rgba(210, 230, 250, 0.5);
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            margin-left: 0.3rem;
            white-space: nowrap;
        }

        .category-links {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* стиль карточки‑ссылки (почти как раньше, но адаптирован под вертикаль) */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;  /* текст после иконки */
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
            box-shadow: 0 6px 12px -6px rgba(30, 50, 70, 0.15),
                        0 3px 6px rgba(0, 0, 0, 0.02),
                        inset 0 -1px 0 rgba(0,0,0,0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-decoration: none;
            color: #1e3c5a;
            font-weight: 550;
            font-size: 1.1rem;
            gap: 12px;
            width: 100%;
            white-space: nowrap;
        }

        .link-card i {
            font-size: 1.7rem;
            width: 2rem;
            text-align: center;
            transition: transform 0.15s ease;
            color: #2c577c;
            flex-shrink: 0;
        }

        /* индивидуальные оттенки иконок */
        .link-card .fa-telegram { color: #2A8BD2; }
        .link-card .fa-envelope { color: #D94A3D; }
        .link-card .fa-behance { color: #1769FF; }
        .link-card .fa-bolt { color: #000000; } /* Vercel */
        .link-card .fa-building { color: #d1442c; } /* hh.ru */
        .link-card .fa-github { color: #24292e; }

        .link-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 20px -10px rgba(25, 75, 105, 0.25),
                        0 6px 10px -4px rgba(0,0,0,0.1);
            background: white;
            border-color: rgba(90, 150, 210, 0.3);
        }

        .link-card:hover i {
            transform: scale(1.08);
        }

        .link-card:active {
            transform: scale(0.98);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }

        footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #3f5e7a;
            opacity: 0.7;
            border-top: 1px dashed #b6cfdf;
            padding-top: 1.5rem;
        }

        /* Адаптивность */
        @media (max-width: 850px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .links-container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 550px) {
            .categories-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .category-title {
                font-size: 1.6rem;
            }
            .link-card {
                padding: 0.7rem 1rem;
                font-size: 1rem;
                white-space: normal;   /* допускаем перенос, но у нас короткие */
            }
        }
    </style>
</head>
<body>
    <div class="links-container">
        <h1>🔗 ссылки по категориям</h1>
        <div class="subhead">все важные места в одном месте</div>

        <!-- Категории с названиями в скобках (Telegram, Mail и т.д.) -->
        <div class="categories-grid">
            <!-- Категория: Контакты -->
            <div class="category">
                <div class="category-title">
                    Контакты <span>(Telegram, Mail)</span>
                </div>
                <div class="category-links">
                    <!-- Telegram -->
                    <a href="#" target="_blank" rel="noopener" class="link-card">
                        <i class="fab fa-telegram"></i>
                        <span>Telegram</span>
                    </a>
                    <!-- Mail (контакты) -->
                    <a href="mailto:hello@example.com" class="link-card">
                        <i class="fas fa-envelope"></i>
                        <span>Mail</span>
                    </a>
                </div>
            </div>

            <!-- Категория: Работы -->
            <div class="category">
                <div class="category-title">
                    Работы <span>(Behance, Vercel)</span>
                </div>
                <div class="category-links">
                    <!-- Behance -->
                    <a href="#" target="_blank" rel="noopener" class="link-card">
                        <i class="fab fa-behance"></i>
                        <span>Behance</span>
                    </a>
                    <!-- Vercel (портфолио) -->
                    <a href="#" target="_blank" rel="noopener" class="link-card">
                        <i class="fas fa-bolt"></i>
                        <span>Vercel · portfolio</span>
                    </a>
                </div>
            </div>

            <!-- Категория: Другое -->
            <div class="category">
                <div class="category-title">
                    Другое <span>(hh, GitHub)</span>
                </div>
                <div class="category-links">
                    <!-- HeadHunter -->
                    <a href="#" target="_blank" rel="noopener" class="link-card">
                        <i class="fas fa-building"></i>
                        <span>HeadHunter</span>
                    </a>
                    <!-- GitHub -->
                    <a href="#" target="_blank" rel="noopener" class="link-card">
                        <i class="fab fa-github"></i>
                        <span>GitHub</span>
                    </a>
                </div>
            </div>
        </div>

        <footer>
            ✦ наведи — увидишь магию ✦ замени # на свои настоящие ссылки ✦
        </footer>
    </div>
</body>
</html>
